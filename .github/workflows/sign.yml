name: Daily Sign

on:
  schedule:
    # UTC 16:00 = 北京时间每日 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式: sign=执行签到并发送邮件(默认); send_mail=仅用当日缓存签到结果发送邮件(调试,不执行签到)'
        required: false
        default: sign
        type: choice
        options:
          - sign
          - send_mail

permissions:
  # keepalive-workflow 需要推空提交；写回 SJS_DOMAINS Variable 需要 actions: write
  contents: write
  actions: write

# job 级环境变量:Secrets / Variables 直接注入进程,
# 脚本在 env 模式下读取 SJS_* 构建配置,全程内存内完成,不生成任何文件
env:
  SJS_USERNAME: ${{ secrets.SJS_USERNAME }}
  SJS_PASSWORD: ${{ secrets.SJS_PASSWORD }}
  SJS_COOKIE: ${{ secrets.SJS_COOKIE }}
  SJS_SMTP_HOST: ${{ secrets.SJS_SMTP_HOST }}
  SJS_SMTP_PORT: ${{ secrets.SJS_SMTP_PORT }}
  SJS_SMTP_SSL: ${{ secrets.SJS_SMTP_SSL }}
  SJS_SMTP_SENDER: ${{ secrets.SJS_SMTP_SENDER }}
  SJS_SMTP_PASSWORD: ${{ secrets.SJS_SMTP_PASSWORD }}
  SJS_SMTP_RECEIVERS: ${{ secrets.SJS_SMTP_RECEIVERS }}
  SJS_DOMAINS: ${{ vars.SJS_DOMAINS }}

jobs:
  sign:
    name: 每日签到
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 防 60 天不活跃停用:由下方"写回签到活动记录到仓库"步骤每次产生真实 commit 实现
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 恢复当日签到结果缓存(供 send_mail 调试模式使用)
      - name: 恢复签到结果缓存
        uses: actions/cache/restore@v4
        with:
          path: sijishe_cache.json
          key: sign-cache-${{ github.run_id }}
          restore-keys: |
            sign-cache-

      # ===== 模式:sign(默认)= 执行签到 =====
      - name: 执行签到
        if: inputs.mode == '' || inputs.mode == 'sign'
        id: sign
        run: |
          python sijishe_api.py sign > /tmp/sign_result.json
          python - <<'EOF'
          import json
          d = json.load(open('/tmp/sign_result.json', encoding='utf-8'))
          print(f"状态: {d.get('state')} | {d.get('result')}")
          print("----")
          print(d.get('report', ''))
          print("----")
          EOF
          echo "domains=$(python -c "import json;print(','.join(json.load(open('/tmp/sign_result.json')).get('domains', [])))")" >> "$GITHUB_OUTPUT"

      # 将本次签到结果写入 docs/sign_records.md 并 commit 回仓库:
      # 既保留格式化的历史签到记录(可在仓库直接查看),又让每次运行产生真实 commit,
      # 避免"60 天无 commit 被 GitHub 停用 scheduled workflow"
      - name: 写回签到活动记录到仓库
        if: always() && (inputs.mode == '' || inputs.mode == 'sign') && steps.sign.outcome != 'skipped'
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          result_path = Path('/tmp/sign_result.json')
          record_path = Path('docs/sign_records.md')
          if not result_path.exists():
              print("::warning::未找到签到结果 JSON,跳过记录写回")
              raise SystemExit(0)

          d = json.loads(result_path.read_text(encoding='utf-8'))
          state = d.get('state', 'failed')
          result = (d.get('result', '') or '').replace('|', '\\|').replace('\n', ' ')
          domains = d.get('domains', []) or []
          icon = {'success': '✅', 'break': '⚠️', 'failed': '❌'}.get(state, '❓')
          state_label = {'success': '成功', 'break': '断签', 'failed': '失败'}.get(state, state)
          # 记录时间:按北京时间生成
          from datetime import datetime, timezone, timedelta
          ts = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')

          header = [
              '# 签到活动记录',
              '',
              '> 由 GitHub Actions 每次签到后自动写回,仅保留最近 100 条。',
              '',
              '| 时间(UTC+8) | 状态 | 结果 | 域名数 |',
              '|---|---|---|---|',
          ]
          lines = header[:]
          if record_path.exists():
              old = record_path.read_text(encoding='utf-8').splitlines()
              # 复用旧表头之前的标题,仅提取表格数据行(以 | 开头且非表头分隔)
              for line in old:
                  s = line.strip()
                  if s.startswith('|') and not s.startswith('|---') and not s.startswith('| 时间'):
                      lines.append(s)
          lines.append(f'| {ts} | {icon} {state_label} | {result} | {len(domains)} |')
          # 裁剪到最近 100 条数据行
          data_rows = lines[len(header):]
          if len(data_rows) > 100:
              data_rows = data_rows[-100:]
          record_path.parent.mkdir(parents=True, exist_ok=True)
          record_path.write_text('\n'.join(header + data_rows) + '\n', encoding='utf-8')
          print(f"已写入签到记录: {ts} {state_label}")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sign_records.md
          if git diff --cached --quiet; then
            echo "记录无变化,跳过提交"
          else
            git commit -m "docs(sign): 记录 $(TZ=UTC-8 date '+%Y-%m-%d %H:%M') 签到结果"
            git push
          fi

      # 将本次探寻到的域名列表写回仓库 Variable SJS_DOMAINS,供下次运行作为种子
      # 变量不存在时自动创建;写回失败不阻断签到结果,仅告警
      # 注意:公开仓库中 GITHUB_TOKEN 无法写 repository variables,
      #   需在仓库 Settings → Secrets 配置 SJS_GH_TOKEN(fine-grained PAT,权限: Actions Read and write);
      #   未配置则跳过写回(不影响签到,仅域名列表不会自动更新)
      - name: 同步域名列表到仓库 Variable
        if: always() && steps.sign.outputs.domains != ''
        env:
          GH_TOKEN: ${{ secrets.SJS_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SJS_DOMAINS_NEW: ${{ steps.sign.outputs.domains }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request, urllib.error

          value = os.environ["SJS_DOMAINS_NEW"]
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          body = json.dumps({"name": "SJS_DOMAINS", "value": value}).encode()
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          base = f"https://api.github.com/repos/{repo}/actions/variables"

          def _req(method, url):
              return urllib.request.Request(url, data=body, method=method, headers=headers)

          try:
              with urllib.request.urlopen(_req("PATCH", f"{base}/SJS_DOMAINS")) as resp:
                  print(f"已更新 SJS_DOMAINS: {value}")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  # 变量不存在,自动创建
                  try:
                      with urllib.request.urlopen(_req("POST", base)) as resp:
                          print(f"已创建 SJS_DOMAINS: {value}")
                  except urllib.error.HTTPError as e2:
                      print(f"::warning::创建 SJS_DOMAINS 失败 HTTP {e2.code}: {e2.read().decode()[:300]}")
              else:
                  msg = e.read().decode()[:200]
                  print(f"::warning::写回 SJS_DOMAINS 失败 HTTP {e.code}: {msg}")
                  if e.code == 403:
                      if "personal access token" in msg:
                          print("::warning::SJS_GH_TOKEN 权限不足:fine-grained PAT 须勾选 Actions(Read and write) 且仓库访问包含本仓库;或 classic PAT 勾选 repo scope")
                      elif "integration" in msg:
                          print("::warning::GITHUB_TOKEN 无法写 variables:请在仓库 Settings → Secrets 配置 SJS_GH_TOKEN(fine-grained PAT 勾选 Actions Read and write)")
                      else:
                          print("::warning::请检查 Secret SJS_GH_TOKEN 的 Actions(Read and write) 权限")
          EOF

      # ===== 模式:send_mail(调试)= 仅用当日缓存结果发送邮件,不执行签到 =====
      - name: 发送缓存签到结果邮件(调试)
        if: inputs.mode == 'send_mail'
        run: python sijishe_api.py send_cached_mail

      # 保存签到结果缓存(供下次 send_mail 调试使用)
      - name: 保存签到结果缓存
        if: always() && inputs.mode != 'send_mail'
        uses: actions/cache/save@v4
        with:
          path: sijishe_cache.json
          key: sign-cache-${{ github.run_id }}
